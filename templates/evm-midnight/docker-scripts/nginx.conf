events {
    worker_connections 1024;
}

http {
    server {
        # --- MODIFIED: Nginx now listens on port 8080 ---
        listen 8080;
        server_name localhost;

        location / {
            # --- UNCHANGED: Still proxies to the binary on 9944 ---
            proxy_pass http://127.0.0.1:9944;
            # proxy_set_header Host "localhost";
        }
    }
}