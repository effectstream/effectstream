name: "${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME}"

x-hardened-service: &hardened-service
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777

services:
  scaffold-tests:
    <<: *hardened-service
    profiles:
      - scaffold
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: scaffold-test
    network_mode: none

  diagnostics:
    <<: *hardened-service
    profiles:
      - diagnostics
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: scaffold-test
    command:
      - bun
      - -e
      - >-
        Bun.serve({hostname:'0.0.0.0',port:3000,fetch(){return new Response('midnight-v2 diagnostics')}})
    ports:
      - "127.0.0.1:${MIDNIGHT_V2_DIAGNOSTIC_PORT:?Set a preflighted port above 10000}:3000"

  live-read-tests:
    <<: *hardened-service
    profiles:
      - live-read
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: live-read-test
    networks:
      - toolchain

  node-image:
    profiles:
      - image-preflight
    image: docker.io/midnightntwrk/midnight-node@sha256:caf93d6f9fb3630c906ef3e714c151655377f3d28f907d17545de1870514da2e

  indexer-image:
    profiles:
      - image-preflight
    image: docker.io/midnightntwrk/indexer-standalone@sha256:5d79f3a20da9ed86236c7f7dc9d93b1beeb0b0c47c9c43a791041322eb80b74e
    platform: linux/amd64

  proof-image:
    profiles:
      - image-preflight
    image: docker.io/midnightntwrk/proof-server@sha256:4f02ca2734649eb238d13924df299b1c82bd5546ec928c5d67bdd0ce86dd0bd1

  midnight-node:
    profiles:
      - toolchain-smoke
      - sink-e2e
      - ccc-e2e
      - hermetic
      - live-write-test
    image: docker.io/midnightntwrk/midnight-node@sha256:caf93d6f9fb3630c906ef3e714c151655377f3d28f907d17545de1870514da2e
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
      RUST_LOG: warn
    command:
      - --validator
      - --alice
      - --force-authoring
      - --unsafe-force-node-key-generation
      - --rpc-external
      - --rpc-cors=all
      - --rpc-methods=unsafe
    tmpfs:
      - /node/chain:size=1g,mode=0755
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -H 'content-type: application/json'
          --data '{"jsonrpc":"2.0","id":1,"method":"chain_getHeader","params":[]}'
          http://localhost:9944 |
          grep -Eq '"number":"0x[1-9a-fA-F][0-9a-fA-F]*"'
      interval: 5s
      timeout: 3s
      retries: 36
    networks:
      - toolchain

  indexer:
    profiles:
      - toolchain-smoke
      - sink-e2e
      - ccc-e2e
      - hermetic
      - live-write-test
    image: docker.io/midnightntwrk/indexer-standalone@sha256:5d79f3a20da9ed86236c7f7dc9d93b1beeb0b0c47c9c43a791041322eb80b74e
    platform: linux/amd64
    restart: on-failure:5
    depends_on:
      midnight-node:
        condition: service_healthy
    environment:
      APP__INFRA__NODE__URL: ws://midnight-node:9944
      APP__INFRA__SPO_NODE__URL: ws://midnight-node:9944
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: dummy-not-using-spo
      APP__INFRA__SPO_NODE__RECONNECT_MAX_DELAY: 24h
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__SECRET: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      RUST_LOG: warn
    healthcheck:
      test: [CMD-SHELL, test -f /var/run/indexer-standalone/running]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - toolchain

  proof-server-experimental:
    profiles:
      - toolchain-smoke
      - sink-e2e
      - hosted-keccak
      - ccc-e2e
      - hermetic
      - live-write-test
      - live-write
    image: docker.io/midnightntwrk/proof-server@sha256:4f02ca2734649eb238d13924df299b1c82bd5546ec928c5d67bdd0ce86dd0bd1
    environment:
      RUST_LOG: warn
      MIDNIGHT_PARAM_SOURCE: https://midnight-s3-fileshare-dev-eu-west-1.s3.eu-west-1.amazonaws.com/
      MIDNIGHT_PP: /proof-params
    volumes:
      - proof-params:/proof-params
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          while read -r slot local_address remainder; do
          case "$$local_address" in *:189C) exit 0;; esac;
          done < /proc/net/tcp; exit 1
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - toolchain

  proof-server-plain:
    profiles:
      - toolchain-smoke
    image: docker.io/midnightntwrk/proof-server@sha256:d96a4d0f3f0f10f82698288443f2873a32fed180eb8f93c0bae83572c0a187a9
    environment:
      RUST_LOG: info
      MIDNIGHT_PARAM_SOURCE: https://midnight-s3-fileshare-dev-eu-west-1.s3.eu-west-1.amazonaws.com/
      MIDNIGHT_PP: /proof-params
    volumes:
      - proof-params:/proof-params
    networks:
      - toolchain

  toolchain-tests:
    <<: *hardened-service
    profiles:
      - toolchain-smoke
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: proof-smoke-test
    environment:
      EXPERIMENTAL_PROOF_SERVER_URL: http://proof-server-experimental:6300
      PLAIN_PROOF_SERVER_URL: http://proof-server-plain:6300
    depends_on:
      indexer:
        condition: service_healthy
      proof-server-experimental:
        condition: service_started
      proof-server-plain:
        condition: service_started
    networks:
      - toolchain

  sink-tests:
    <<: *hardened-service
    profiles:
      - sink-e2e
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: sink-e2e-test
    environment:
      MIDNIGHT_V2_NODE_URL: ws://midnight-node:9944
      MIDNIGHT_V2_INDEXER_HTTP_URL: http://indexer:8088/api/v4/graphql
      MIDNIGHT_V2_INDEXER_WS_URL: ws://indexer:8088/api/v4/graphql/ws
      MIDNIGHT_V2_PROOF_SERVER_URL: http://proof-server-experimental:6300
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      midnight-node:
        condition: service_healthy
      indexer:
        condition: service_healthy
      proof-server-experimental:
        condition: service_healthy
    networks:
      - toolchain

  hosted-keccak-tests:
    <<: *hardened-service
    profiles:
      - hosted-keccak
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: hosted-keccak-test
    environment:
      RUN_STAGENET_WRITE_TESTS: ${RUN_STAGENET_WRITE_TESTS:-0}
      MIDNIGHT_V2_READ_ONLY_WALLET_PROBE: ${MIDNIGHT_V2_READ_ONLY_WALLET_PROBE:-0}
      MIDNIGHT_V2_WALLET_SEED_FILE: /run/secrets/stagenet-wallet-seed
      MIDNIGHT_V2_NODE_URL: wss://rpc.stagenet.shielded.tools
      MIDNIGHT_V2_INDEXER_HTTP_URL: https://indexer.stagenet.shielded.tools/api/v4/graphql
      MIDNIGHT_V2_INDEXER_WS_URL: wss://indexer.stagenet.shielded.tools/api/v4/graphql/ws
      MIDNIGHT_V2_PROOF_SERVER_URL: http://proof-server-experimental:6300
    secrets:
      - stagenet-wallet-seed
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      proof-server-experimental:
        condition: service_healthy
    networks:
      - toolchain

  ccc-tests:
    <<: *hardened-service
    profiles:
      - ccc-e2e
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: ccc-e2e-test
    environment:
      MIDNIGHT_V2_NODE_URL: ws://midnight-node:9944
      MIDNIGHT_V2_INDEXER_HTTP_URL: http://indexer:8088/api/v4/graphql
      MIDNIGHT_V2_INDEXER_WS_URL: ws://indexer:8088/api/v4/graphql/ws
      MIDNIGHT_V2_PROOF_SERVER_URL: http://proof-server-experimental:6300
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      midnight-node:
        condition: service_healthy
      indexer:
        condition: service_healthy
      proof-server-experimental:
        condition: service_healthy
    networks:
      - toolchain

  tests:
    <<: *hardened-service
    profiles:
      - hermetic
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: hermetic-e2e-test
    environment:
      MIDNIGHT_V2_NETWORK_ID: undeployed
      MIDNIGHT_V2_NODE_URL: ws://midnight-node:9944
      MIDNIGHT_V2_INDEXER_HTTP_URL: http://indexer:8088/api/v4/graphql
      MIDNIGHT_V2_INDEXER_WS_URL: ws://indexer:8088/api/v4/graphql/ws
      MIDNIGHT_V2_PROOF_SERVER_URL: http://proof-server-experimental:6300
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      midnight-node:
        condition: service_healthy
      indexer:
        condition: service_healthy
      proof-server-experimental:
        condition: service_healthy
    networks:
      - toolchain

  live-write-tests:
    <<: *hardened-service
    profiles:
      - live-write-test
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: live-write-test
    environment:
      MIDNIGHT_V2_NETWORK_ID: undeployed
      MIDNIGHT_V2_NODE_URL: ws://midnight-node:9944
      MIDNIGHT_V2_INDEXER_HTTP_URL: http://indexer:8088/api/v4/graphql
      MIDNIGHT_V2_INDEXER_WS_URL: ws://indexer:8088/api/v4/graphql/ws
      MIDNIGHT_V2_PROOF_SERVER_URL: http://proof-server-experimental:6300
      MIDNIGHT_V2_WRITE_WALLET_SEED_FILE: /run/secrets/undeployed-genesis-wallet-seed
    secrets:
      - undeployed-genesis-wallet-seed
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      midnight-node:
        condition: service_healthy
      indexer:
        condition: service_healthy
      proof-server-experimental:
        condition: service_healthy
    networks:
      - toolchain

  hosted-write-tests:
    <<: *hardened-service
    profiles:
      - live-write
    build:
      context: ../..
      dockerfile: templates/midnight-stagenet-v2/Dockerfile
      target: hosted-write-test
    environment:
      RUN_STAGENET_WRITE_TESTS: ${RUN_STAGENET_WRITE_TESTS:-0}
      MIDNIGHT_V2_WRITE_WALLET_FUNDED: ${MIDNIGHT_V2_WRITE_WALLET_FUNDED:-0}
      MIDNIGHT_V2_RUN_ID: ${MIDNIGHT_V2_RUN_ID:-}
      MIDNIGHT_V2_WRITE_WALLET_SEED_FILE: /run/secrets/stagenet-wallet-seed
      MIDNIGHT_V2_NETWORK_ID: stagenet
      MIDNIGHT_V2_NODE_URL: wss://rpc.stagenet.shielded.tools
      MIDNIGHT_V2_INDEXER_HTTP_URL: https://indexer.stagenet.shielded.tools/api/v4/graphql
      MIDNIGHT_V2_INDEXER_WS_URL: wss://indexer.stagenet.shielded.tools/api/v4/graphql/ws
      MIDNIGHT_V2_PROOF_SERVER_URL: http://proof-server-experimental:6300
    secrets:
      - stagenet-wallet-seed
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      proof-server-experimental:
        condition: service_healthy
    networks:
      - toolchain

networks:
  toolchain:
    driver: bridge

volumes:
  proof-params:

secrets:
  stagenet-wallet-seed:
    file: ${MIDNIGHT_V2_WALLET_SEED_SOURCE_FILE:-/dev/null}
  undeployed-genesis-wallet-seed:
    file: ./packages/tests/fixtures/undeployed-genesis-seed.txt
