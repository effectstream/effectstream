[package]
name = "counter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal Solana counter program for the effectstream solana-starter template"
resolver = "2"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "1.18.26"

[package.metadata.solana]
program-id = "8veT8XVnBxG6kmq27CrCgznCtVHLJsBAqGHZrodKaRJ6"

# Force lockfile format v3 — cargo-build-sbf from Solana 1.18 invokes cargo in
# a way that rejects the newer v4 lockfile format generated by default on
# recent Rust toolchains. Remove this once we move to a Solana SDK that
# supports v4 lockfiles.
[lockfile]
version = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = true
