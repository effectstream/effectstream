<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZSwap DA — Celestia Swap Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px;">
    <!-- Left: 3D Logo -->
    <div id="logo-container" style="width: 80px; height: 80px; flex-shrink: 0; position: relative; z-index: 10;"></div>
    
    <!-- Center: Title -->
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 20px;">
      <h1 style="justify-content: center; width: 100%; margin-bottom: 4px;">ZSwap DA <span class="badge badge-midnight">MIDNIGHT</span><span class="badge badge-da">CELESTIA</span></h1>
      <p class="subtitle" style="margin-bottom: 0;">Create token mints and swap offers, submit offers to Celestia, and track completion status from Midnight.</p>
    </div>
    
    <!-- Right: Actions -->
    <div class="header-actions" style="display: flex; flex-direction: column; align-items: stretch; gap: 8px;">
      <button class="mint-btn-top" onclick="openMintModal()">+ Mint New Token</button>
      <button class="mint-btn-top" style="background: #3b82f6; color: white; border-color: #3b82f6;">Connect Wallet</button>
    </div>
  </div>

  <!-- Mint Modal -->
  <div id="mint-modal" class="modal-overlay" onclick="if(event.target === this) closeMintModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Mint New Token</h2>
        <button class="modal-close" onclick="closeMintModal()">&times;</button>
      </div>
      <div style="margin-bottom:10px;">
        <label>Mint Type</label>
        <select id="mint-type" onchange="onMintTypeChange()">
          <option value="shielded">Shielded (mint_shielded)</option>
          <option value="unshielded">Unshielded (mint_unshielded)</option>
        </select>
      </div>
      <div class="row">
        <div>
          <label>Domain Separator (hex, 32 bytes)</label>
          <input id="mint-domain-sep" type="text" placeholder="0x01 or 64-hex chars">
        </div>
        <div style="max-width:180px;">
          <label>Amount</label>
          <input id="mint-amount" type="number" min="1" placeholder="100">
        </div>
      </div>
      <div id="mint-nonce-row" style="margin-top:10px;">
        <label>Nonce (Uint128)</label>
        <input id="mint-nonce" type="text" placeholder="0" style="max-width:220px;">
      </div>
      <button id="btn-mint" onclick="mintToken()" style="width: 100%; margin-top: 20px;">Mint on Midnight</button>
      <div id="mint-result" class="result" style="display:none;"></div>
    </div>
  </div>

  <!-- Create ZSwap Offer -->
  <section class="dex-container">
    <h2 style="text-align: center; border: none; font-size: 1.25rem; font-weight: 600; color: #0f172a; margin-bottom: 20px;">Swap</h2>
    
    <div class="info-box" style="text-align: center; margin-bottom: 24px; font-size: 0.8rem; justify-content: center;">
      Offers are submitted as JSON blobs to the Celestia DA layer.
    </div>

    <!-- Giving Panel -->
    <div class="token-panel">
      <div class="token-panel-header">
        <span>You pay</span>
      </div>
      <div id="gives-entries">
        <!-- Replaced dynamically, structured differently now -->
      </div>
      <div style="margin-top: 8px; text-align: center;">
        <button onclick="addEntry('gives')" style="background: transparent; color: #94a3b8; border: none; font-size: 0.8rem; padding: 4px; cursor: pointer; transition: color 0.2s;" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#94a3b8'">+ Add another token</button>
      </div>
    </div>
    
    <!-- Swap Icon -->
    <div class="dex-swap-icon">
      <button class="dex-swap-btn" onclick="swapSides()" title="Swap Give and Want">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
      </button>
    </div>
    
    <!-- Wanting Panel -->
    <div class="token-panel">
      <div class="token-panel-header">
        <span>You receive</span>
      </div>
      <div id="wants-entries">
        <!-- Replaced dynamically, structured differently now -->
      </div>
      <div style="margin-top: 8px; text-align: center;">
        <button onclick="addEntry('wants')" style="background: transparent; color: #94a3b8; border: none; font-size: 0.8rem; padding: 4px; cursor: pointer; transition: color 0.2s;" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#94a3b8'">+ Add another token</button>
      </div>
    </div>

    <button id="btn-submit" class="dex-submit-btn" onclick="submitOffer()">Create Transaction</button>
    <div id="submit-result" class="result" style="display:none; margin-top: 16px;"></div>
  </section>

  <!-- ZSwaps List -->
  <section>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="margin: 0; border: none; padding: 0;">ZSwap Offers <span id="zswap-count" style="font-size:0.8rem;color:#64748b;font-weight:normal;"></span></h2>
      <div style="display:flex; gap:8px;">
        <button onclick="loadZSwaps()" style="margin: 0; padding: 6px 12px; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0;">↻ Refresh</button>
        <button id="zswap-filters-toggle" class="btn-small" style="margin: 0;" onclick="toggleZswapFilters()">Filter</button>
      </div>
    </div>
    <div id="zswap-filters-container" class="hidden" style="display:flex; flex-wrap:wrap; gap:12px; margin-bottom: 10px; align-items:flex-end;">
      <div style="flex:1; min-width: 220px;">
        <label for="zswap-filter-token-select">Filter by token</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="zswap-filter-token-select" onchange="onZswapFilterTokenChange()" style="flex:0 0 180px;">
            <option value="">Any token</option>
            <option value="custom">Custom token...</option>
          </select>
          <input
            id="zswap-filter-token-custom"
            type="text"
            placeholder="Token hex address..."
            style="display:none; flex:1;"
          />
        </div>
      </div>
      <div style="width: 140px;">
        <label for="zswap-filter-side">Side</label>
        <select id="zswap-filter-side">
          <option value="any">Any</option>
          <option value="GIVING">Giving</option>
          <option value="WANTING">Wanting</option>
        </select>
      </div>
      <div style="width: 140px;">
        <label for="zswap-limit">Per page</label>
        <select id="zswap-limit">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100" selected>100</option>
        </select>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-small" style="margin-top: 0;" onclick="applyZswapFilters()">Apply</button>
        <button class="btn-small" style="margin-top: 0; background:#e5e7eb;color:#374151;" onclick="resetZswapFilters()">Clear</button>
      </div>
    </div>
    <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 8px;">
      <div id="zswap-page-info" style="font-size:0.8rem;color:#64748b;"></div>
      <div style="display:flex; gap:6px;">
        <button id="zswap-prev-btn" class="btn-small" style="margin:0; background:#e5e7eb;color:#374151;" onclick="prevZswapPage()" disabled>Prev</button>
        <button id="zswap-next-btn" class="btn-small" style="margin:0; background:#e5e7eb;color:#374151;" onclick="nextZswapPage()" disabled>Next</button>
      </div>
    </div>
    <div id="zswaps-list" class="table-responsive">
      <span style="color:#64748b;font-size:0.85rem;">Click Refresh to load offers from the node.</span>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./main.js"></script>
</body>
</html>
