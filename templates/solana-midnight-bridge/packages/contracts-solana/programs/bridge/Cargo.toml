[package]
name = "bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Effectstream Solana <-> Midnight bridge POC: SPL vault with Lock / operator-signed Release"
resolver = "2"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Lets another crate (or a host-side test) link the instruction helpers without
# pulling in a second `entrypoint!`.
no-entrypoint = []
# solana-program 1.18's `entrypoint!` macro expands `cfg(feature = "custom-heap")`
# and `cfg(feature = "custom-panic")` in THIS crate. Declaring them (empty, never
# enabled) silences the two `unexpected_cfgs` warnings newer rustc emits.
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "1.18.26"
# 4.0.3 is the newest spl-token whose solana-program requirement is a plain
# `^1.18.11`, so it unifies with 1.18.26. 4.0.1/4.0.2 say `>=1.17/1.18, <=2`,
# which can admit solana-program 2.0.0 next to 1.18.26; 5.x/6.x need ^2.0.
spl-token = { version = "4.0.3", features = ["no-entrypoint"] }

# Program id of keypair/bridge-program.json — the LOCAL-ONLY dev keypair the
# local validator preloads. A real cluster gets its own id (deploy-devnet.ts).
[package.metadata.solana]
program-id = "2bqN4ePY9kHSyHkSxhc8WTdRDfpk9BGThCAqGoh6cagf"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = true
