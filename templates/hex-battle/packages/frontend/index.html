<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hex Battle</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container" data-testid="hex-app">
    <h2>⬡ Hex Battle</h2>

    <section id="wallet-section">
      <h3>Connect Wallet</h3>
      <p id="wallet-address" data-testid="wallet-address">Not connected</p>
      <button
        id="connect-browser"
        data-testid="connect-browser-wallet"
        onclick="window.uiConnectBrowser()"
      >Connect Browser Wallet</button>
      <button
        id="connect-local"
        data-testid="connect-local-wallet"
        onclick="window.uiConnectLocal()"
      >Connect Local Wallet (dev)</button>
    </section>

    <!-- Main menu: create a lobby, browse open lobbies, see your stats. -->
    <section id="main-menu" data-testid="main-menu" style="margin-top: 1rem;">
      <h3>Main Menu</h3>

      <div id="create-lobby" data-testid="create-lobby" style="margin-top: 0.5rem;">
        <h4>Create Lobby</h4>
        <label>Players: <input id="num-players" type="number" value="2" min="2" max="5" style="width:50px;" /></label>
        <label>Gold: <input id="gold" type="number" value="100" min="0" style="width:70px;" /></label>
        <label>Init tiles: <input id="init-tiles" type="number" value="4" min="1" style="width:50px;" /></label>
        <button data-testid="create-lobby-btn" onclick="window.uiCreateLobby()">Create Lobby (37-tile map)</button>
      </div>

      <div id="player-stats" data-testid="player-stats" style="margin-top: 0.5rem;">
        <h4>Your Record</h4>
        <button data-testid="refresh-stats-btn" onclick="window.uiRefreshStats()">Refresh Record</button>
        <span id="stats-text" data-testid="stats-text">—</span>
      </div>
    </section>

    <!-- Open lobbies you can join. -->
    <section id="open-lobbies" data-testid="open-lobbies" style="margin-top: 1rem;">
      <h3>Open Lobbies</h3>
      <button data-testid="refresh-lobbies-btn" onclick="window.uiRefreshLobbies()">Refresh</button>
      <ul id="lobby-list" data-testid="lobby-list"></ul>
    </section>

    <!-- The active hex game: shows the q/r/s board, players and the move
         controls. This IS the gameplay surface. -->
    <section id="hex-game" data-testid="hex-game" style="margin-top: 1rem; display:none;">
      <h3>Battle</h3>
      <p>Lobby: <span id="game-lobby-id" data-testid="game-lobby-id"></span>
         — Turn: <span id="game-turn" data-testid="game-turn"></span></p>
      <div id="players" data-testid="players"></div>

      <!-- Hex board surface: each tile is an absolutely-positioned hexagon laid
           out from its q/r cube coordinate. -->
      <div id="hex-board" data-testid="hex-board" class="hex-board"></div>

      <div id="move-controls" data-testid="move-controls" style="margin-top: 0.75rem;">
        <label>Move:
          <input id="move-input" data-testid="move-input" type="text" value="A0#0"
                 placeholder="A0#0 | 0#0#1#-1 | surrender" style="width:160px;" />
        </label>
        <button data-testid="submit-move-btn" onclick="window.uiSubmitMove()">Submit Move</button>
        <button data-testid="surrender-btn" onclick="window.uiSurrender()">Surrender</button>
        <button data-testid="leave-game-btn" onclick="window.uiLeaveGame()">Back to Menu</button>
      </div>
      <p class="hint">Tip: click a tile to drop a build glyph (units A–D, buildings F/t/T) into the move box.</p>
    </section>
  </div>

  <script type="module" src="./min.js"></script>

  <script>
    let currentLobby = null;
    const HEX_SIZE = 26;

    function setAddress(addr) {
      document.getElementById("wallet-address").innerText = addr ?? "Not connected";
    }

    window.uiConnectBrowser = async () => {
      try {
        await window.hexBattle.connectBrowserWallet();
        setAddress(window.hexBattle.getAddress());
        await window.uiRefreshLobbies();
      } catch (err) {
        console.error("connect-browser failed:", err);
        setAddress(`Browser wallet error: ${err.message}`);
      }
    };

    window.uiConnectLocal = async () => {
      try {
        await window.hexBattle.connectLocalWallet();
        setAddress(window.hexBattle.getAddress());
        await window.uiRefreshLobbies();
      } catch (err) {
        console.error("connect-local failed:", err);
        setAddress(`Local wallet error: ${err.message}`);
      }
    };

    window.uiCreateLobby = async () => {
      const players = parseInt(document.getElementById("num-players").value || "2", 10);
      const gold = parseInt(document.getElementById("gold").value || "100", 10);
      const initTiles = parseInt(document.getElementById("init-tiles").value || "1", 10);
      await window.hexBattle.createLobby(
        players, "AB", "bF", gold, initTiles, window.hexBattle.DEFAULT_MAP, 120, 100,
      );
      setTimeout(window.uiRefreshLobbies, 4000);
    };

    window.uiRefreshLobbies = async () => {
      const lobbies = await window.hexBattle.fetchOpenLobbies();
      const list = document.getElementById("lobby-list");
      list.innerHTML = "";
      (lobbies ?? []).forEach((lobby) => {
        const li = document.createElement("li");
        li.dataset.testid = `lobby-${lobby.lobby_id}`;
        li.innerHTML = `<span>${lobby.lobby_id} (players: ${lobby.num_of_players})</span> `;
        const joinBtn = document.createElement("button");
        joinBtn.innerText = "Join";
        joinBtn.dataset.testid = `join-${lobby.lobby_id}`;
        joinBtn.onclick = () => window.uiJoinLobby(lobby.lobby_id);
        li.appendChild(joinBtn);
        const openBtn = document.createElement("button");
        openBtn.innerText = "Open";
        openBtn.onclick = () => window.uiOpenGame(lobby.lobby_id);
        li.appendChild(openBtn);
        list.appendChild(li);
      });
    };

    window.uiJoinLobby = async (lobbyId) => {
      await window.hexBattle.joinLobby(lobbyId);
      setTimeout(() => window.uiOpenGame(lobbyId), 4000);
    };

    window.uiRefreshStats = async () => {
      const addr = window.hexBattle.getAddress();
      const text = document.getElementById("stats-text");
      if (!addr) { text.innerText = "connect a wallet"; return; }
      const stats = await window.hexBattle.fetchPlayer(addr.toLowerCase());
      if (!stats) { text.innerText = "no record"; return; }
      text.innerText = `W:${stats.wins} L:${stats.losses} D:${stats.draws} (played ${stats.played_games})`;
    };

    window.uiOpenGame = async (lobbyId) => {
      currentLobby = lobbyId;
      document.getElementById("hex-game").style.display = "block";
      document.getElementById("game-lobby-id").innerText = lobbyId;
      await window.uiRenderGame();
    };

    // Render the hex board from the lobby's serialized game state.
    window.uiRenderGame = async () => {
      if (!currentLobby) return;
      const lobby = await window.hexBattle.fetchLobby(currentLobby);
      const board = document.getElementById("hex-board");
      const playersDiv = document.getElementById("players");
      const turnSpan = document.getElementById("game-turn");
      board.innerHTML = "";
      if (!lobby) { board.innerText = "lobby not found"; return; }
      turnSpan.innerText = String(lobby.current_round ?? 0);

      const gs = lobby.gameState;
      if (!gs || !gs.map || !Array.isArray(gs.map.tiles)) {
        board.innerText = lobby.lobby_state === "open"
          ? "(waiting for players — board appears once the lobby is full)"
          : "(no board)";
        playersDiv.innerHTML = "";
        return;
      }

      // Players list.
      playersDiv.innerHTML = (gs.players ?? [])
        .map((p, i) => `<div data-testid="player-${i}">${p.name ?? p.id} — gold ${p.gold} ${p.alive ? "" : "(defeated)"}</div>`)
        .join("");

      // Layout: convert q/r cube coords to pixel positions (pointy-top hex).
      let minX = Infinity, minY = Infinity;
      const placed = gs.map.tiles.map((t) => {
        const x = HEX_SIZE * (1.5 * t.q);
        const y = HEX_SIZE * (Math.sqrt(3) / 2 * t.q + Math.sqrt(3) * t.r);
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        return { t, x, y };
      });
      placed.forEach(({ t, x, y }) => {
        const cell = document.createElement("div");
        cell.className = "hex-tile";
        cell.dataset.testid = `tile-${t.q}-${t.r}`;
        cell.style.left = `${x - minX}px`;
        cell.style.top = `${y - minY}px`;
        const ownerId = t.owner ? t.owner.id : null;
        if (ownerId) cell.classList.add(`owner-${ownerId}`);
        let glyph = "";
        if (t.unit) glyph = t.unit.type;
        else if (t.building) glyph = t.building.type;
        cell.innerHTML = `<span class="coord">${t.q},${t.r}</span><span class="glyph">${glyph}</span>`;
        cell.onclick = () => {
          // Click drops a "build unit A at this tile" token into the move box.
          document.getElementById("move-input").value = `A${t.q}#${t.r}`;
        };
        board.appendChild(cell);
      });
    };

    window.uiSubmitMove = async () => {
      if (!currentLobby) return;
      const lobby = await window.hexBattle.fetchLobby(currentLobby);
      if (!lobby) return;
      const move = document.getElementById("move-input").value.trim();
      await window.hexBattle.submitMove(currentLobby, lobby.current_round ?? 0, move);
      setTimeout(window.uiRenderGame, 4000);
    };

    window.uiSurrender = async () => {
      if (!currentLobby) return;
      await window.hexBattle.surrender(currentLobby);
      setTimeout(window.uiRenderGame, 4000);
    };

    window.uiLeaveGame = () => {
      currentLobby = null;
      document.getElementById("hex-game").style.display = "none";
    };
  </script>
</body>

</html>
