<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Effectstream Minimal</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h2>Connect Wallet</h2>
        <div id="address">Not connected</div>
        <button id="login" onclick="walletConnect()">Connect Wallet</button>

        <h2>Send transaction to Effectstream L2</h2>
        <input id="transaction-input" type="text" value="" placeholder="Enter your message" />
        <button onclick="sendTx()">Send TX</button>

        <hr />
        <h2>Inputs Log</h2>
        <button onclick="fetchInputs()">Refresh</button>
        <pre id="inputs-data"></pre>
    </div>
</body>

<script type="module" src="./min.js"></script>

<script>
    async function fetchInputs() {
        const response = await fetch("http://localhost:9999/api/inputs");
        const data = await response.json();
        document.getElementById("inputs-data").innerText = JSON.stringify(
            data.inputs,
            null,
            2,
        );
    }

    async function walletConnect() {
        const wallet = await effectstream.login();
        const { address } = wallet.provider.getAddress();
        document.getElementById("address").innerText = address;
    }

    async function sendTx() {
        const input = document.getElementById("transaction-input").value;
        const result = await effectstream.sendTransactionEffectstreamL2(input);
        console.log(result);
        await fetchInputs();
    }
</script>

</html>
