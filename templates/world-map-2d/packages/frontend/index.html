<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Map 2D</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h2>World Map 2D</h2>
    <p>An EffectStream-powered open-world grid. Connect a wallet, join the world, and move.</p>

    <section>
      <h3>1. Connect Wallet</h3>
      <p id="wallet-address" data-testid="wallet-address">Not connected</p>
      <button
        id="connect-browser"
        data-testid="connect-browser-wallet"
        onclick="window.uiConnectBrowser()"
      >Connect Browser Wallet</button>
      <button
        id="connect-local"
        data-testid="connect-local-wallet"
        onclick="window.uiConnectLocal()"
      >Connect Local Wallet (dev)</button>
    </section>

    <section>
      <h3>2. Join &amp; move</h3>
      <button data-testid="join-world-btn" onclick="window.uiJoinWorld()">Join world</button>
      <span> — submit a move at coordinates: </span>
      <input id="move-x" data-testid="move-x" type="number" min="0" max="9" value="3" style="width:48px" />
      <input id="move-y" data-testid="move-y" type="number" min="0" max="9" value="4" style="width:48px" />
      <button data-testid="submit-move-btn" onclick="window.uiSubmitMove()">Submit move</button>
      <button data-testid="submit-increment-btn" onclick="window.uiSubmitIncrement()">Increment cell</button>
    </section>

    <section>
      <h3>3. Stats</h3>
      <button data-testid="refresh-stats-btn" onclick="window.uiRefresh()">Refresh</button>
      <pre id="stats-output" data-testid="stats-output"></pre>
    </section>
  </div>

  <script type="module" src="./min.js"></script>

  <script>
    function setAddress(addr) {
      document.getElementById("wallet-address").innerText = addr ?? "Not connected";
    }

    window.uiConnectBrowser = async () => {
      try {
        await window.worldMap2D.connectBrowserWallet();
        setAddress(window.worldMap2D.getAddress());
      } catch (err) {
        console.error("connect-browser failed:", err);
        setAddress(`Browser wallet error: ${err.message}`);
      }
    };

    window.uiConnectLocal = async () => {
      try {
        await window.worldMap2D.connectLocalWallet();
        setAddress(window.worldMap2D.getAddress());
      } catch (err) {
        console.error("connect-local failed:", err);
        setAddress(`Local wallet error: ${err.message}`);
      }
    };

    window.uiJoinWorld = async () => {
      try { await window.worldMap2D.joinWorld(); }
      catch (err) { console.error(err); }
      await window.uiRefresh();
    };

    window.uiSubmitMove = async () => {
      const x = Number(document.getElementById("move-x").value);
      const y = Number(document.getElementById("move-y").value);
      try { await window.worldMap2D.submitMove(x, y); }
      catch (err) { console.error(err); }
      await window.uiRefresh();
    };

    window.uiSubmitIncrement = async () => {
      const x = Number(document.getElementById("move-x").value);
      const y = Number(document.getElementById("move-y").value);
      try { await window.worldMap2D.submitIncrement(x, y); }
      catch (err) { console.error(err); }
      await window.uiRefresh();
    };

    window.uiRefresh = async () => {
      const user = await window.worldMap2D.fetchUserStats();
      const world = await window.worldMap2D.fetchWorldStats();
      document.getElementById("stats-output").innerText = JSON.stringify(
        { user, world: (world ?? []).slice(0, 10) },
        null,
        2,
      );
    };
  </script>
</body>

</html>
