# Hermetic stack for the multi-product batcher e2e guard.
#
# Ports live in the 12800 block and are bound to loopback, so this suite never
# collides with a developer's stack on the default Midnight ports (9944/8088/
# 6300/3334) or with the deep-suite stack in templates/multi-batcher.
#
#   12834  shared batcher     (container 3334)
#   12844  midnight node RPC  (container 9944)
#   12863  proof server       (container 6300)
#   12888  indexer GraphQL    (container 8088)
#
# One proof server is enough here: the guard submits a handful of transactions
# and is not a throughput test.
#
# `run-tests.ts` brings this up and tears it down; you rarely run it by hand.

name: multibatcher-e2e

services:
  node:
    image: 'midnightntwrk/midnight-node:${NODE_TAG:-1.0.0}'
    ports:
      - '127.0.0.1:12844:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >
          curl -fs -H 'Content-Type: application/json' -d
          '{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[1]}' http://localhost:9944 | grep -q
          '"result":"0x'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  indexer:
    image: 'midnightntwrk/indexer-standalone:${INDEXER_TAG:-4.3.2}'
    ports:
      - '127.0.0.1:12888:8088'
    environment:
      RUST_LOG: 'indexer=warn,indexer_api=warn,wallet_indexer=warn,warn'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
    healthcheck:
      # image has neither curl nor wget — probe the file the indexer writes when running
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 45s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: 'midnightntwrk/proof-server:${PROOF_TAG:-8.1.0}'
    ports:
      - '127.0.0.1:12863:6300'
    environment:
      RUST_BACKTRACE: 'full'

  # Deploys the counter contract and runs the 3-product shared batcher.
  # Funding + assertions are driven from the host by run-tests.ts.
  # MONOREPO_ROOT is written into .env by run-tests.ts before `up`.
  app:
    image: oven/bun:1
    # Run as the host user: the bind mount is the developer's checkout,
    # and a root-owned artifact written here cannot be cleaned up later.
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: '${MONOREPO_ROOT}/e2e/multi-batcher'
    command: ['bun', 'run', 'entry.ts']
    ports:
      - '127.0.0.1:12834:3334'
    environment:
      MIDNIGHT_NETWORK_ID: 'undeployed'
      MIDNIGHT_NODE_HTTP: 'http://node:9944'
      MIDNIGHT_INDEXER_HTTP: 'http://indexer:8088/api/v3/graphql'
      MIDNIGHT_INDEXER_WS: 'ws://indexer:8088/api/v3/graphql/ws'
      MIDNIGHT_PROOF_SERVER_URL: 'http://proof-server:6300'
      MIDNIGHT_STORAGE_PASSWORD: 'YourPasswordMy1!'
      BATCHER_PORT: '3334'
      # Exposes the target-scoped admin routes (/clear-inputs, /force-batch)
      # the suite asserts on. Test stack only — never enable in production.
      ENABLE_DEV_AND_DEBUG_ENDPOINTS: 'true'
    volumes:
      - '${MONOREPO_ROOT}:${MONOREPO_ROOT}'
    depends_on:
      node:
        condition: service_healthy
      indexer:
        condition: service_healthy
      proof-server:
        condition: service_started
