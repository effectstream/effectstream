[upstream]
peer_address = "localhost:3001"
network_magic = 42
is_testnet = true

[storage]
version = "v2"
path = "data"
max_wal_history = 10000

[genesis]
# note: filled programmatically

[sync]
pull_batch_size = 100
sync_limit = "NoLimit"

[submit]

[serve.grpc]
listen_address = "[::]:50051"
permissive_cors = true

[serve.minibf]
listen_address = "[::]:3000"
permissive_cors = true

[serve.trp]
listen_address = "[::]:8000"
max_optimize_rounds = 10
permissive_cors = true

[chain]
type = "cardano"
custom_utxos = []

[chain.track]
account_state = false
asset_state = false
pool_state = true
epoch_state = true
drep_state = true
proposal_logs = true
tx_logs = true
account_logs = true
pool_logs = true
epoch_logs = true

[logging]
max_level = "INFO"
include_tokio = false
include_pallas = false
include_grpc = false
include_trp = false
include_minibf = false
