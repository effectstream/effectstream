# Pull requests must be a first-class trigger: a push to an external fork runs
# only in that fork and cannot report checks to this repository. Keep pushes on
# the default branch for post-merge validation, and use the PR merge ref for one
# pre-merge run (rather than duplicating every same-repository branch push).
on:
  push:
    branches: [v-next, midnight-1]
  pull_request:
    # Expensive jobs skip drafts. Re-run when a draft becomes reviewable, and
    # cancel an in-progress run through the PR-scoped concurrency group when a
    # pull request is converted back to draft.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

name: Effectstream Test Workflow

# This workflow executes untrusted pull-request code. It does not need secrets
# or repository writes; fork PRs also receive GitHub's read-only token and
# first-time-contributor approval boundary.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which downstream jobs run, based on what changed.
  #   core      → packages/** or e2e/** (plus the e2e build-infra files)
  #   templates → space-separated list of ENABLED templates whose dir changed
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.classify.outputs.core }}
      templates: ${{ steps.classify.outputs.templates }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LONG_LIVED_BRANCHES: v-next,midnight-1
        run: bun .github/ci-changes.ts

  # Existing Dockerized e2e suite — now gated on core changes.
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' && (github.event_name == 'push' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-22.04
    # 11 suites run serially and green runs already sit at 28-29 min, so a
    # single E2E_MAX_RETRIES retry of any one suite blew the old 30-min budget —
    # the job was killed mid-retry and reported as `cancelled`, which reads like
    # "superseded by a newer push" rather than "timed out".
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build testing image
        run: docker build -t testing_image:${{ github.sha }} -f .github/Dockerfile .

      - name: Run PGlite lifecycle regression
        run: |
          docker run --rm --name db_lifecycle_${{ github.run_number }} testing_image:${{ github.sha }} \
            bun test packages/node-sdk/db/test/start-pglite.test.ts \
              packages/node-sdk/db/test/start-pglite-multifile.test.ts

      - name: Run e2e tests
        run: docker run --rm --name e2e_${{ github.run_number }} testing_image:${{ github.sha }}

  # Per-template tests — runs the changed ENABLED templates serially in one job.
  # Uses the SAME image as e2e; only the command differs. Tests resolve
  # @effectstream/* from published npm (no LINK_LOCAL).
  template-tests:
    needs: changes
    if: ${{ needs.changes.outputs.templates != '' && (github.event_name == 'push' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build testing image
        run: docker build -t testing_image:${{ github.sha }} -f .github/Dockerfile .

      - name: Run template tests
        run: |
          # Plain bash, NOT a login shell: `bash -l` sources /etc/profile which
          # resets root's PATH and drops /root/.local/bin, losing `compact`.
          docker run --rm --name templates_${{ github.run_number }} testing_image:${{ github.sha }} \
            bash -c "bun run templates/run-template-tests.ts ${{ needs.changes.outputs.templates }} --skip-disabled"

  # Browser build (+ tests) of @effectstream/frontend-sdk. This is the ONLY
  # package that needs a build before publish, and that build (`bun run build`,
  # target: "browser") is otherwise never exercised until release-publish time.
  # A node-only module leaking into the browser bundle therefore passes every
  # push/PR check and only blows up the release — which is exactly what happened
  # for v0.100.19–v0.100.22 (@effectstream/midnight-contracts, an optional peer
  # dep of @effectstream/wallets reached via dynamic import, pulled `node:util`
  # parseArgs into the bundle). Run the build + its regression test here, gated on
  # core changes, so the failure surfaces in PRs instead of at release.
  frontend-build:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' && (github.event_name == 'push' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs build.test.ts (spawns the real `bun run build`, asserting the
      # browser bundle succeeds + node-only optional peers stay external) and
      # examples.test.ts (the public re-export surface).
      - name: Build & test frontend SDK
        run: bun test packages/frontend/test/

  # The `assets.ts` bundles inline .sql / .txt sources as base64. They are
  # generated files, but the generator used to be a deno/jsr tool we can no
  # longer run, so they were hand-patched and both went stale unnoticed (a
  # dropped `CREATE EXTENSION pg_ivm` in the db bundle, `@paima/` remappings in
  # the evm-hardhat one). Regenerate + diff so drift can never ship again.
  # Ungated: it takes seconds, needs no `bun install`, and gating it on `core`
  # would skip it for a change to the generator itself (outside packages/).
  assets-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # No `bun install`: the generator only uses Bun/node builtins.
      - name: Check generated asset bundles are in sync
        run: bun run assets:check

  # Release security is deliberately path-ungated: changes to any workflow,
  # package metadata, or package discovery can affect the immutable publisher.
  # Draft pull requests skip the work, matching the expensive repository jobs.
  release-tests:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Build exact release-security test image
        shell: bash
        run: |
          docker build --tag "effectstream-release-tests:${{ github.sha }}" --file - . <<'DOCKERFILE'
          FROM node:24.20.0-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
          RUN apt-get update \
              && apt-get install -y --no-install-recommends ca-certificates git \
              && rm -rf /var/lib/apt/lists/*
          RUN npm install --global --ignore-scripts=false bun@1.4.0
          RUN test "$(node --version)" = 'v24.20.0' \
              && test "$(npm --version)" = '11.19.0' \
              && test "$(bun --version)" = '1.4.0'
          WORKDIR /work
          DOCKERFILE

      - name: Run release unit, registry, recovery, source, and cross-process gates
        shell: bash
        run: |
          docker run --rm --name "release_tests_${{ github.run_id }}_${{ github.run_attempt }}" \
            --volume "$PWD:/work" --workdir /work \
            --env EFFECTSTREAM_TEST_REGISTRY_PORT=18750 \
            "effectstream-release-tests:${{ github.sha }}" bash -lc '
              set -euo pipefail
              test "$(node --version)" = "v24.20.0"
              test "$(npm --version)" = "11.19.0"
              test "$(bun --version)" = "1.4.0"
              git config --global --add safe.directory /work
              bun test ./.github/publish-bun.effectstream.test.ts
              bun test ./.github/publish-bun.effectstream.registry.test.ts
              bun test ./.github/release-recovery.test.ts
              bash .github/verify-release-source.test.sh
              cross_run_dir="$(mktemp -d)"
              trap '\''rm -rf "$cross_run_dir"'\'' EXIT
              EFFECTSTREAM_TEST_REGISTRY_PORT=18751 EFFECTSTREAM_CROSS_RUN_DIR="$cross_run_dir" EFFECTSTREAM_CROSS_RUN_PHASE=producer \
                bun test ./.github/publish-bun.effectstream.registry.test.ts
              EFFECTSTREAM_TEST_REGISTRY_PORT=18751 EFFECTSTREAM_CROSS_RUN_DIR="$cross_run_dir" EFFECTSTREAM_CROSS_RUN_PHASE=consumer \
                bun test ./.github/publish-bun.effectstream.registry.test.ts
            '

      - name: Lint every workflow with pinned actionlint
        run: |
          docker run --rm \
            --volume "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

  # Aggregate gate: a single stable check to mark required in branch protection.
  # Passes when the gated jobs succeed or are skipped; fails if any fails or is
  # cancelled (or if the changes job itself failed).
  ci-ok:
    needs: [changes, e2e, template-tests, frontend-build, assets-check, release-tests]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          TEMPLATE_TESTS_RESULT: ${{ needs.template-tests.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
          ASSETS_CHECK_RESULT: ${{ needs.assets-check.result }}
          RELEASE_TESTS_RESULT: ${{ needs.release-tests.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT"
          echo "e2e=$E2E_RESULT"
          echo "template-tests=$TEMPLATE_TESTS_RESULT"
          echo "frontend-build=$FRONTEND_BUILD_RESULT"
          echo "assets-check=$ASSETS_CHECK_RESULT"
          echo "release-tests=$RELEASE_TESTS_RESULT"

          if [ "$CHANGES_RESULT" != 'success' ] || [ "$ASSETS_CHECK_RESULT" != 'success' ]; then
            echo '::error::Unconditional change classification or asset verification did not succeed.'
            exit 1
          fi
          for gated_result in "$E2E_RESULT" "$TEMPLATE_TESTS_RESULT" "$FRONTEND_BUILD_RESULT"; do
            case "$gated_result" in
              success|skipped) ;;
              *)
                echo '::error::A change-gated job failed, was cancelled, or has an unknown result.'
                exit 1
                ;;
            esac
          done

          case "$EVENT_NAME:$PR_DRAFT" in
            push:false|pull_request:false)
              test "$RELEASE_TESTS_RESULT" = 'success'
              ;;
            pull_request:true)
              test "$RELEASE_TESTS_RESULT" = 'skipped'
              ;;
            *)
              echo '::error::Unsupported event or draft state for the aggregate gate.'
              exit 1
              ;;
          esac
          echo 'All required jobs reached their event-appropriate success or skip state.'
