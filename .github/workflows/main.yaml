on: [push]

name: Effectstream Test Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-v2:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build testing image
        run: docker build -t testing_image:${{ github.sha }} -f .github/Dockerfile .

      - name: Run e2e-v2 tests (EVM + Features + Bitcoin)
        run: docker run --rm --name e2e_v2_${{ github.run_number }} testing_image:${{ github.sha }}
