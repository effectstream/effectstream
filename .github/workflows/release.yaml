on:
  release:
    types: [published]

name: Effectstream Release Publish

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout v-next
        uses: actions/checkout@v7
        with:
          ref: v-next
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # All version validation (semver + strictly-greater), root bump, per-package
      # bump, dep pinning, publish, and version-only cleanup live in the script.
      # No --allow-uncommitted: the tree is clean at the script's git-check, since
      # it writes the root version only after that check (.npmrc is gitignored).
      - name: Publish
        run: bun run .github/publish-bun.effectstream.ts --publish --release-version "${{ github.event.release.tag_name }}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Refresh root release lockfile
        run: bun install --lockfile-only --ignore-scripts

      - name: Remove npm credentials before image build
        run: rm -f .npmrc

      - name: Commit & push version bumps
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock \
            ':(glob)packages/**/package.json'
          while IFS= read -r file; do
            case "$file" in
              package.json|bun.lock|packages/*/package.json) ;;
              *) echo "::error::Unexpected release file staged: $file"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          if git diff --cached --quiet; then
            echo "no version changes to commit"
          else
            git commit -m "chore(release): ${{ github.event.release.tag_name }}"
            git push origin v-next
          fi

  template-runtime-image:
    needs: publish
    uses: ./.github/workflows/template-runtime-image.yaml
    with:
      version: ${{ github.event.release.tag_name }}
      ref: v-next
      promote_latest: true
      runner: ${{ vars.TEMPLATE_RUNTIME_RUNNER }}
    secrets: inherit
