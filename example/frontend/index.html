<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paima Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Header Row -->
        <header class="header">
            <h1 class="title">Paima Explorer</h1>
            <div class="block-info">
                <span>Latest Block: </span>
                <span id="latest-block">Loading...</span>
            </div>
        </header>

        <!-- Columns Container -->
        <div class="columns-container">
            <!-- Paima Engine Column (Main) -->
            <div class="column main-column">
                <h2 class="column-title">Paima Engine</h2>
                <div class="block-time">Block Time: <span id="paima-block-time">2s</span></div>
                <div class="blocks-list" id="paima-blocks"></div>
            </div>

            <!-- EVM Main Column -->
            <div class="column">
                <h2 class="column-title">EVM Main</h2>
                <div class="block-time">Block Time: <span id="evm-main-block-time">2s</span></div>
                <div class="blocks-list" id="evm-main-blocks"></div>
            </div>

            <!-- EVM Parallel Column -->
            <div class="column">
                <h2 class="column-title">EVM Parallel</h2>
                <div class="block-time">Block Time: <span id="evm-parallel-block-time">3s</span></div>
                <div class="blocks-list" id="evm-parallel-blocks"></div>
            </div>

            <!-- Cardano Column -->
            <div class="column">
                <h2 class="column-title">Cardano</h2>
                <div class="block-time">Block Time: <span id="cardano-block-time">2s</span></div>
                <div class="blocks-list" id="cardano-blocks"></div>
            </div>

            <!-- Midnight Column -->
            <div class="column">
                <h2 class="column-title">Midnight</h2>
                <div class="block-time">Block Time: <span id="midnight-block-time">6s</span></div>
                <div class="blocks-list" id="midnight-blocks"></div>
            </div>
        </div>

        <!-- Dynamic Tables Section -->
        <div class="tables-section">
            <h2 class="section-title">Primitive Data</h2>
            <div id="primitive-tables" class="primitive-tables"></div>
        </div>

        <!-- State Machine Tables Section -->
        <div class="tables-section">
            <h2 class="section-title">State Machine Tables</h2>
            <div style="margin-bottom: 20px; text-align: center;">
                <input type="text" id="batcher-input" placeholder='Enter JSON array: ["attack", 5, 10]'
                    style="padding: 10px; width: 300px; border: 2px solid #667eea; border-radius: 8px; margin-right: 10px;">
                <button id="send-to-batcher" onclick="handleBatcherSubmit()"
                    style="padding: 10px 20px; background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                    Send to Batcher
                </button>
            </div>
            <div id="static-tables" class="primitive-tables"></div>
        </div>
    </div>
    <script type="module">
        import { createClient, createWalletClient, http, parseEther } from 'https://esm.sh/viem'
        import { privateKeyToAccount, generatePrivateKey } from 'https://esm.sh/viem/accounts'
        import { hardhat } from 'https://esm.sh/viem/chains'

        // Make these available globally for the main script
        window.viem = {
            createWalletClient,
            http,
            parseEther,
            privateKeyToAccount,
            generatePrivateKey,
            hardhat
        };
    </script>
    <script type="module" src="script.js"></script>
</body>

</html>
